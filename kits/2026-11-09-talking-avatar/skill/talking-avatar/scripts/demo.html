<!doctype html><html><body style="margin:0;background:#0f172a;display:flex;align-items:center;justify-content:center;height:100vh">
<div style="position:relative;width:1280px;height:720px;overflow:hidden"><canvas id="c" style="position:absolute;inset:0;width:100%;height:100%"></canvas></div>
<audio id="a" src="voice.wav"></audio>
<script src="ta.js"></script>
<script>
window.run = async () => {
  const a = document.getElementById('a'), c = document.getElementById('c');
  const ctx = new AudioContext(); const src = ctx.createMediaElementSource(a); const an = ctx.createAnalyser(); an.fftSize = 1024;
  const dest = ctx.createMediaStreamDestination(); src.connect(an); an.connect(ctx.destination); an.connect(dest);
  const buf = new Float32Array(an.fftSize);
  const getLevel = () => { an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v*v; return Math.sqrt(s/buf.length); };
  await TA.startTalkingAvatar(c, { baseUrl: 'atlas', getLevel, swayEl: c });
  const stream = new MediaStream([...c.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 8e6 }); const chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);
  const done = new Promise((r) => (rec.onstop = r));
  rec.start(); await ctx.resume(); await a.play();
  await new Promise((r) => (a.onended = r)); await new Promise((r) => setTimeout(r, 300)); rec.stop(); await done;
  const b = new Blob(chunks, { type: 'video/webm' }); const ab = await b.arrayBuffer();
  let bin = ''; const u = new Uint8Array(ab); for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return btoa(bin);
};
</script></body></html>
